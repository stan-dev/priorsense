url: https://mc-stan.org/priorsense/

destination: "."

development:
  mode: auto

template:
  package: pkgdownconfig

articles:
  - title: Getting started
    desc: |
      These pages demonstrate how to use the **priorsense** package to check prior and likelihood sensitivity for Bayesian models fit using MCMC.
    contents:
      - getting_started
      - priorsense_with_stan
      - priorsense_with_brms
      - priorsense_with_jags
      - priorsense_with_nimble
  - title: Additional examples
    desc: |
      These pages demonstrate how to use the **priorsense** package in more detail.
    contents:
      - airquality
  - title: Further details
    contents:
      - sensitivity_diagnostic
      - quantity_of_interest
      - papers

reference:
  - title: Package description
    contents:
      - priorsense-package
  - title: Numerical power-scaling sensitivity checks
    desc: |
      Numerical sensitivity checks for prior and likelihood
    contents:
      - powerscale_sensitivity
      - powerscale_derivative
  - title: Graphical checks
    desc: |
      Plots for power-scaling sensitivity checks
    contents:
      - powerscale_plot_dens
      - powerscale_plot_ecdf
      - powerscale_plot_quantities
  - title: Example models
    desc: |
      Provides example model code and data for different PPLs compatible with priorsense
    contents:
      - example_powerscale_model
  - title: Other functions for exploring sensitivity
    contents:
      - powerscale
      - powerscale_sequence
      - powerscale_gradients
      - create_priorsense_data
  - title: Helper functions
    contents:
      - create_priorsense_data
      - log_lik_draws
      - log_prior_draws
      - predictions_as_draws
      - cjs_dist

